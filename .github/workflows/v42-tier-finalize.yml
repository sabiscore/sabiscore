name: v4.2 tier finalization

on:
  push:
    branches:
      - chore/v4-2-tier-finalize
    paths:
      - .github/workflows/v42-tier-finalize.yml

permissions:
  contents: write

concurrency:
  group: v42-tier-finalize
  cancel-in-progress: false

jobs:
  apply-validate-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      EXPECTED_BASE: ec6d14c8c9cc85380c1a6f13f64e8db59821e65a
      TIER1_B64_GZ: 
      TIER3_B64_GZ: 
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify immutable base
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "$EXPECTED_BASE"
          git diff --check "$EXPECTED_BASE" HEAD

      - name: Configure release identity
        run: |
          git config user.name "SabiScore Release Bot"
          git config user.email "actions@users.noreply.github.com"

      - name: Apply and validate Tier 1
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TIER1_B64_GZ" | base64 -d | gzip -d > /tmp/tier1.patch
          git apply --check /tmp/tier1.patch
          git apply /tmp/tier1.patch
          git diff --check
          corepack enable
          pnpm install --frozen-lockfile
          pnpm --filter @sabiscore/web typecheck
          pnpm --filter @sabiscore/web lint
          pnpm --filter @sabiscore/web test
          git add apps/web/src/app/page.tsx
          git commit -m "fix(web): wire authoritative mobile status and motion-safe CTA"

      - name: Apply and validate Tier 3 tokens
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$TIER3_B64_GZ" | base64 -d | gzip -d > /tmp/tier3.patch
          git apply --check /tmp/tier3.patch
          git apply /tmp/tier3.patch
          git diff --check
          pnpm --filter @sabiscore/web typecheck
          pnpm --filter @sabiscore/web lint
          pnpm --filter @sabiscore/web test
          pnpm --filter @sabiscore/web build
          git add apps/web/tailwind.config.ts apps/web/src/lib/verdict-tokens.ts
          git commit -m "refactor(web): promote verdict signal tokens to Tailwind"

      - name: Remove one-shot workflow and publish staging branch
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/v42-tier-finalize.yml
          git commit -m "chore: remove one-shot v4.2 tier finalizer"
          git diff --check "$EXPECTED_BASE" HEAD
          git push origin HEAD:chore/v4-2-tier-finalize
