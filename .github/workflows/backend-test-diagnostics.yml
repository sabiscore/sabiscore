name: Backend Test Diagnostics

on:
  pull_request:
    branches: [master]
    paths:
      - "backend/**"
      - ".github/workflows/backend-test-diagnostics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    name: Backend pytest cohort diagnostics
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sabi
          POSTGRES_PASSWORD: test_password
          POSTGRES_DB: sabiscore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sabi -d sabiscore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://sabi:test_password@localhost:5432/sabiscore_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-please-rotate
      PROVIDER_LIVE_TESTS: "false"

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Diagnose changed PR12 unit tests
        id: changed_unit
        continue-on-error: true
        working-directory: backend
        run: >-
          python -m pytest -q
          tests/unit/test_fixture_sync.py
          tests/unit/test_canonical_identity_service.py
          tests/unit/test_verification_sql_runner.py
          tests/unit/test_ml_ultra_availability.py

      - name: Diagnose untouched unit tests
        id: untouched_unit
        continue-on-error: true
        working-directory: backend
        run: >-
          python -m pytest tests/unit -q
          --ignore=tests/unit/test_fixture_sync.py
          --ignore=tests/unit/test_canonical_identity_service.py
          --ignore=tests/unit/test_verification_sql_runner.py
          --ignore=tests/unit/test_ml_ultra_availability.py

      - name: Diagnose top-level backend tests
        id: top_level
        continue-on-error: true
        working-directory: backend
        shell: bash
        run: python -m pytest tests/*.py -q

      - name: Diagnose integration tests
        id: integration
        continue-on-error: true
        working-directory: backend
        run: python -m pytest tests/integration -q

      - name: Diagnose provider tests
        id: providers
        continue-on-error: true
        working-directory: backend
        run: python -m pytest tests/providers -q

      - name: Fail if any diagnostic cohort failed
        if: always()
        shell: bash
        run: |
          echo "changed_unit=${{ steps.changed_unit.outcome }}"
          echo "untouched_unit=${{ steps.untouched_unit.outcome }}"
          echo "top_level=${{ steps.top_level.outcome }}"
          echo "integration=${{ steps.integration.outcome }}"
          echo "providers=${{ steps.providers.outcome }}"
          test "${{ steps.changed_unit.outcome }}" = success
          test "${{ steps.untouched_unit.outcome }}" = success
          test "${{ steps.top_level.outcome }}" = success
          test "${{ steps.integration.outcome }}" = success
          test "${{ steps.providers.outcome }}" = success
