name: v4.2 Ruff Diagnostic

on:
  push:
    branches:
      - feat/v42-ruff-diagnostic
    paths:
      - .github/workflows/v42-ruff-diagnostic.yml

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - working-directory: backend
        run: pip install -r requirements-dev.txt
      - name: Ruff GitHub annotations
        working-directory: backend
        run: ruff check src --select E4,E7,E9,F --output-format=github
