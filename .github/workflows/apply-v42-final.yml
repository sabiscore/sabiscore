name: Apply SabiScore v4.2 final

on:
  push:
    branches: [chore/v4-2-final-apply]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: chore/v4-2-final-apply

      - name: Verify staging base
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_MASTER=8f97d345bbdd1b29b8d6e0c7ad3bc37b5c2464a5
          git fetch origin master
          test "$(git rev-parse origin/master)" = "$EXPECTED_MASTER"

      - name: Reconstruct and verify patch
        shell: bash
        run: |
          set -euo pipefail
          cat .v42-apply/chunk-*.b64 | base64 --decode | gzip -d > "$RUNNER_TEMP/v42.patch"
          git apply --check "$RUNNER_TEMP/v42.patch"
          git apply "$RUNNER_TEMP/v42.patch"
          rm -rf .v42-apply .github/workflows/apply-v42-final.yml
          git diff --check

      - name: Validate Python and active artifacts
        shell: bash
        run: |
          set -euo pipefail
          python -m compileall -q backend/src backend/scripts/replay_elo_from_db.py backend/tests
          cd backend
          python scripts/verify_active_artifacts.py

      - name: Commit reconciled v4.2 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "SabiScore Release Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "feat: apply SabiScore v4.2 production hardening"
          git push origin HEAD:chore/v4-2-final-apply
