name: CI - Canonical Platform

on:
  push:
    branches: [main, master, develop, "feat/**"]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  security:
    name: Secret Scan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Secret scan with Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_CONFIG: .gitleaks.toml
          GITLEAKS_EXTRA_ARGS: "--redact --verbose"

  skill-registry:
    name: Skill Registry Drift Check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: make validate-strict (schema + filesystem existence)
        run: make validate-strict

  backend-quality:
    name: Backend Lint, Typecheck, Tests
    runs-on: ubuntu-latest
    needs: security

    permissions:
      contents: read

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_DB: sabiscore_test
          POSTGRES_USER: sabi
          POSTGRES_PASSWORD: test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sabi -d sabiscore_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      APP_ENV: test
      DATABASE_URL: postgresql://sabi:test_password@localhost:5432/sabiscore_test
      REDIS_URL: redis://localhost:6379/0
      SECRET_KEY: test-secret-key-for-ci-only-please-rotate
      PROVIDER_LIVE_TESTS: "false"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Required/recommended for accurate Sonar SCM blame,
          # branch analysis, new-code detection and PR analysis.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Show quality-tool versions
        working-directory: backend
        run: |
          python --version
          pytest --version
          coverage --version
          python -m pytest --help | grep -- --cov

      - name: Ruff before tests
        working-directory: backend
        run: ruff check src --select E4,E7,E9,F

      - name: MyPy debt ceiling
        working-directory: backend
        run: python scripts/check_mypy_ceiling.py --ceiling 784

      - name: Alembic upgrade
        working-directory: backend
        run: alembic upgrade head

      - name: Alembic schema drift check
        working-directory: backend
        run: alembic check

      - name: Zero-fabrication scan
        working-directory: backend
        shell: bash
        run: |
          # ⚠️ Every check below was `! grep ...` and NONE of them could fail
          # this step. POSIX exempts a command whose return value is inverted
          # with `!` from `set -e`, so a positive match did not abort, and the
          # step's exit code was only ever the LAST line's. Eight of the nine
          # checks - including the datetime.utcnow one, which had a real live
          # violation in src/services/social_auth_models.py - were inert from
          # the day they were written. Verified, not inferred: under
          # `bash --noprofile --norc -eo pipefail` (what `shell: bash` runs),
          # a two-line script whose first `! grep` MATCHES exits 0.
          #
          # `forbid` records a violation instead of inverting an exit code, so
          # every check runs and ALL violations are reported in one pass.
          violations=0

          forbid() {
            local label="$1"; shift
            local out
            local rc=0
            # `|| rc=$?`, not `; rc=$?`: under `set -e` an assignment from a
            # command substitution takes the substitution's exit status, so a
            # clean `grep` (exit 1, no match) would abort the step before
            # `rc=$?` ever ran. A `||` list is exempt from `set -e`.
            out="$(grep -rn "$@" 2>&1)" || rc=$?
            case "$rc" in
              0)  echo "::error::zero-fabrication scan violated: $label"
                  printf '%s\n' "$out"
                  violations=$((violations + 1)) ;;
              1)  ;;  # no match - clean
              *)  # grep itself failed (bad path, unreadable file). Never treat
                  # an unrunnable check as a passing one.
                  echo "::error::zero-fabrication scan could not run: $label (grep exit $rc)"
                  printf '%s\n' "$out"
                  violations=$((violations + 1)) ;;
            esac
          }

          forbid "FEATURE_DEFAULTS[ in services/api/insights" \
            "FEATURE_DEFAULTS\[" src/services src/api src/insights --include="*.py"
          forbid "FEATURE_DEFAULTS[ in data/transformers.py" \
            "FEATURE_DEFAULTS\[" src/data/transformers.py
          forbid "hardcoded_odds" \
            "hardcoded_odds" src/services src/api src/providers --include="*.py"
          forbid "Base.metadata.create_all in alembic" \
            "Base\.metadata\.create_all" alembic --include="*.py"
          forbid "full_kelly_fraction" \
            "full_kelly_fraction" src --include="*.py"

          # datetime.utcnow() deprecated (Python 3.12+): clean across ALL of
          # src. database.py SQLAlchemy column callable defaults are exempt.
          # New service code writing a naive DateTime column must use
          # src/utils/db_time.py's naive_utc_now().
          forbid "datetime.utcnow outside database.py" \
            "datetime\.utcnow" src --include="*.py" --exclude="database.py"

          # INV-19: verification predicates (*_verified/*_validated/*_certified)
          # must be computed, never asserted as bare dict-literal booleans.
          forbid "INV-19 bare verification predicate" -E \
            '"[a-zA-Z_]*(_verified|_validated|_certified)"\s*:\s*(True|False)' \
            src/ --include="*.py"

          cd ..

          forbid "full-Kelly copy in apps/web" \
            "full_kelly\|Full-Kelly\|Full Kelly" \
            apps/web/src --include="*.ts" --include="*.tsx"

          forbid "NEXT_PUBLIC_KELLY_FRACTION" \
            "NEXT_PUBLIC_KELLY_FRACTION" \
            vercel.json .env.example backend/.env.example

          if [ "$violations" -ne 0 ]; then
            echo "zero-fabrication scan FAILED: $violations check(s) violated"
            exit 1
          fi
          echo "zero-fabrication scan: all 9 checks clean"

      - name: Backend tests with branch coverage
        working-directory: backend
        run: |
          python -m pytest tests -q \
            --cov \
            --cov-config=.coveragerc \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml

      - name: Verify Cobertura coverage report
        working-directory: backend
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -s coverage.xml ]; then
            echo "::error::backend/coverage.xml was not generated or is empty"
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path
          import xml.etree.ElementTree as ET

          report = Path("coverage.xml")

          root = ET.parse(report).getroot()

          if root.tag != "coverage":
              raise SystemExit(
                  f"Expected Cobertura <coverage> root, got <{root.tag}>"
              )

          line_rate = float(root.attrib.get("line-rate", "0"))
          branch_rate = float(root.attrib.get("branch-rate", "0"))

          print(f"Coverage report: {report.resolve()}")
          print(f"Line rate:   {line_rate:.4f}")
          print(f"Branch rate: {branch_rate:.4f}")

          sources = [
              element.text
              for element in root.findall("./sources/source")
              if element.text
          ]

          print(f"Coverage sources: {sources}")

          classes = root.findall(".//class")

          if not classes:
              raise SystemExit(
                  "Coverage XML contains no classes/files; refusing Sonar scan"
              )

          filenames = [
              node.attrib.get("filename", "")
              for node in classes[:20]
          ]

          print("Sample coverage paths:")
          for filename in filenames:
              print(f"  {filename}")
          PY

      # ---------------------------------------------------------------
      # SonarQube Cloud
      # ---------------------------------------------------------------
      #
      # External fork PRs intentionally skip this step because GitHub
      # does not expose repository secrets to untrusted forks.
      #
      - name: SonarQube backend scan
        if: >-
          ${{
            github.event_name != 'pull_request' ||
            github.event.pull_request.head.repo.full_name == github.repository
          }}
        uses: SonarSource/sonarqube-scan-action@c7ee0f9df90b7aa20e8dcf9695dcfe2e7da5b4f2  # v7
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_BACKEND_TOKEN }}
        with:
          projectBaseDir: backend
          args: >-
            -Dsonar.projectKey=sabiscore_sabiscore
            -Dsonar.organization=sabiscore

  scraper-quality:
    name: Scraper Validate and Tests
    runs-on: ubuntu-latest
    needs: security

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate scraper source registry and storage contract
        run: pnpm --filter @sabiscore/scraper validate

      - name: Run scraper tests
        run: pnpm --filter @sabiscore/scraper test

  web-quality:
    name: Web Lint, Typecheck, Build
    runs-on: ubuntu-latest
    needs: [security, scraper-quality]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SABISCORE_BACKEND_URL: http://localhost:8000

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint web
        run: pnpm --filter @sabiscore/web lint

      - name: Responsible gambling copy scan
        run: node scripts/copy-scan.mjs

      - name: Typecheck web
        run: pnpm --filter @sabiscore/web typecheck

      - name: Test web
        run: pnpm --filter @sabiscore/web test

      - name: Build web
        run: pnpm --filter @sabiscore/web build
        env:
          NODE_ENV: production

  playwright-smoke:
    name: Playwright Smoke (backend-independent)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: web-quality
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SABISCORE_BACKEND_URL: http://localhost:8000
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @sabiscore/web build

      - name: Run smoke tests
        run: pnpm exec playwright test tests/e2e/intelligence.spec.ts --project=chromium --project=mobile-chrome

  playwright-tier-suites:
    name: Playwright Tier 1-4 (backend-independent, mocked)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: web-quality
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      SABISCORE_BACKEND_URL: http://localhost:8000
      NODE_ENV: production

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.8.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm

      - name: Install workspace dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web
        run: pnpm --filter @sabiscore/web build

      - name: Run tier 1-4 feature-coverage suites
        run: pnpm exec playwright test tests/e2e/tier1-feature-coverage.spec.ts tests/e2e/tier2-boundary-corner-cases.spec.ts tests/e2e/tier3-cross-feature-combinations.spec.ts tests/e2e/tier4-application-scenarios.spec.ts --project=chromium --project=mobile-chrome
