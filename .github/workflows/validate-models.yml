name: Validate Model Artifacts

on:
  push:
    branches: [ master, "feat/**", "ci/**" ]
  pull_request:
    branches: [ master ]

jobs:
  validate-models:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install -r backend/requirements-dev.txt
          pip install joblib scikit-learn

      - name: Verify active artifact pairs
        run: |
          python backend/scripts/verify_active_artifacts.py

      - name: Verify both production loaders and fixture sensitivity
        env:
          PYTHONPATH: backend
          PROVIDER_LIVE_TESTS: "false"
        run: |
          python -m pytest -q \
            backend/tests/unit/test_artifact_serves_both_loaders.py \
            backend/tests/unit/test_model_artifact_loading.py \
            backend/tests/unit/test_model_differentiates_fixtures.py

      - name: Reject candidate promotion without certification
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          manifest = Path("backend/models/candidate/candidate_manifest.json")
          if manifest.exists():
              payload = json.loads(manifest.read_text(encoding="utf-8"))
              if payload.get("promotion_permitted") is not False:
                  raise SystemExit("Candidate manifest must remain non-promotable until certification")
          PY
