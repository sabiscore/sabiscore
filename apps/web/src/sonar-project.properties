# ===================================================================
# SabiScore Frontend — SonarQube / SonarCloud Configuration
# ===================================================================
#
# Location:
#   <repository-root>/sonar-project.properties
#
# Run the Sonar scanner from the repository root so that all paths
# below resolve consistently in local development and CI.
#
# Scope:
#   Production Next.js frontend under apps/web.
#
# ===================================================================


# -------------------------------------------------------------------
# Project Identification
# -------------------------------------------------------------------

# IMPORTANT:
# This key must exactly match the existing SonarQube/SonarCloud
# project key. Do not change it unless the remote Sonar project is
# migrated/renamed at the same time.
sonar.projectKey=sabiscore_sabiscore-frontend

sonar.projectName=SabiScore Frontend

# SonarCloud
sonar.organization=sabiscore


# -------------------------------------------------------------------
# Source Encoding
# -------------------------------------------------------------------

# Required/recommended for reliable JavaScript/TypeScript analysis.
sonar.sourceEncoding=UTF-8


# -------------------------------------------------------------------
# Production Source Scope
# -------------------------------------------------------------------

# SabiScore's actual Next.js application source root.
#
# Do not use generic root-level paths such as:
#   src,app,components,lib,utils
#
# Those do not match the current monorepo layout.
sonar.sources=apps/web/src


# -------------------------------------------------------------------
# Test Scope
# -------------------------------------------------------------------

# Vitest tests are colocated with production code under apps/web/src.
#
# Sonar therefore starts with the same directory for test discovery,
# then sonar.test.inclusions limits TEST scope to actual test files.
sonar.tests=apps/web/src

sonar.test.inclusions=\
apps/web/src/**/*.test.ts,\
apps/web/src/**/*.test.tsx,\
apps/web/src/**/*.spec.ts,\
apps/web/src/**/*.spec.tsx,\
apps/web/src/**/__tests__/**/*.ts,\
apps/web/src/**/__tests__/**/*.tsx


# -------------------------------------------------------------------
# Main-Code Exclusions
# -------------------------------------------------------------------

# The same test files must be excluded from MAIN scope to prevent
# Sonar from indexing a file as both production code and test code.
#
# Build output, node_modules, public/, etc. are intentionally NOT
# listed here because sonar.sources is already restricted to
# apps/web/src. Keeping exclusions narrow reduces configuration drift.
sonar.exclusions=\
apps/web/src/**/*.test.ts,\
apps/web/src/**/*.test.tsx,\
apps/web/src/**/*.spec.ts,\
apps/web/src/**/*.spec.tsx,\
apps/web/src/**/__tests__/**,\
apps/web/src/**/*.stories.ts,\
apps/web/src/**/*.stories.tsx


# -------------------------------------------------------------------
# TypeScript Semantic Analysis
# -------------------------------------------------------------------

# Prevent Sonar from traversing the entire monorepo looking for
# tsconfig files. This also ensures Sonar uses the same strict
# TypeScript project configuration as the production web application.
sonar.typescript.tsconfigPaths=apps/web/tsconfig.json


# -------------------------------------------------------------------
# Coverage Scope
# -------------------------------------------------------------------

# Test files and Storybook-only files should not affect production
# coverage calculations.
sonar.coverage.exclusions=\
apps/web/src/**/*.test.ts,\
apps/web/src/**/*.test.tsx,\
apps/web/src/**/*.spec.ts,\
apps/web/src/**/*.spec.tsx,\
apps/web/src/**/__tests__/**,\
apps/web/src/**/*.stories.ts,\
apps/web/src/**/*.stories.tsx


# -------------------------------------------------------------------
# JavaScript / TypeScript Coverage
# -------------------------------------------------------------------

# IMPORTANT:
#
# Keep this DISABLED until CI actually generates the LCOV report.
#
# The current SabiScore web test command executes:
#
#   vitest run
#
# and the current Vitest configuration does not yet enable a coverage
# provider/output. Enabling this Sonar property before generating LCOV
# would make the configuration imply coverage data that does not exist.
#
# Once Vitest coverage is enabled and CI generates:
#
#   apps/web/coverage/lcov.info
#
# uncomment the following property:
#
# sonar.javascript.lcov.reportPaths=apps/web/coverage/lcov.info


# -------------------------------------------------------------------
# Optional Scanner Memory Override
# -------------------------------------------------------------------

# Sonar normally manages JavaScript/TypeScript analysis adequately
# without an override. Enable this only if scanner logs explicitly
# report Node heap exhaustion on the monorepo.
#
# sonar.javascript.node.maxspace=4096


# -------------------------------------------------------------------
# End of SabiScore Sonar Configuration
# -------------------------------------------------------------------