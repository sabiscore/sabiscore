# ===================================================================
# SabiScore Backend — SonarQube / SonarQube Cloud
# ===================================================================

sonar.projectKey=sabiscore_sabiscore
sonar.projectName=SabiScore Backend

# SonarQube Cloud
sonar.organization=sabiscore

sonar.sourceEncoding=UTF-8
sonar.python.version=3.11

# -------------------------------------------------------------------
# Scope
# -------------------------------------------------------------------

sonar.sources=src,alembic,scripts
sonar.tests=tests
sonar.test.inclusions=tests/**/*.py

# -------------------------------------------------------------------
# Analysis exclusions
# -------------------------------------------------------------------

sonar.exclusions=\
**/__pycache__/**,\
**/*.pyc,\
**/*.pyo,\
**/*.pyd,\
**/.pytest_cache/**,\
**/.mypy_cache/**,\
**/.ruff_cache/**,\
**/.hypothesis/**,\
**/.coverage,\
**/.coverage.*,\
**/htmlcov/**

# -------------------------------------------------------------------
# Coverage
# -------------------------------------------------------------------

sonar.python.coverage.reportPaths=coverage.xml

sonar.coverage.exclusions=\
alembic/**,\
scripts/**,\
src/api/websocket.py,\
src/cli/**,\
src/connectors/**,\
src/models/**,\
src/data/scrapers.py,\
src/core/redis.py,\
src/ml_ultra/**,\
src/scrapers/**

# -------------------------------------------------------------------
# Duplication
# -------------------------------------------------------------------

sonar.cpd.exclusions=alembic/versions/**

# -------------------------------------------------------------------
# SCM
# -------------------------------------------------------------------

sonar.scm.provider=git

sonar.links.scm=https://github.com/sabiscore/sabiscore
sonar.links.ci=https://github.com/sabiscore/sabiscore/actions