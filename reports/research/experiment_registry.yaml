  # =========================================================================
  - experiment_id: E2
    title: "Expected XI / lineup continuity"
    portfolio: "B"
    hypothesis: >-
      Lineup continuity and expected-XI state contribute incremental signal
      beyond roster availability alone.
    migrated_retrospectively: true
    state: SHADOW
    decision: HOLD
    shadow_detail: >-
      Moved to SHADOW 2026-09-11. Gate G5 is not answerable retrospectively -
      /fixtures/lineups publishes no announcement timestamp - so it is now
      measured PROSPECTIVELY by backend/scripts/shadow_monitor_e2_lineups.py,
      which polls upcoming fixtures inside the T-20m..T-15m band and records
      whether a lineup exists at the cutoff. The historical EPL batch harvest is
      SUSPENDED so it cannot race the monitor for the shared 100-call daily
      quota; it is reachable only behind an explicit override flag.
      The monitor records four terminal states and never collapses them:
      TRUE/FALSE are G5 evidence; POLL_FAILED (our outage) and MISSED_WINDOW
      (our scheduling) are operational facts excluded from the rate. Recording
      a failed request as FALSE would manufacture G5 evidence out of our own
      downtime.
      SHADOW is the honest state: the instrument is built, live-shaped and
      tested, but no production fixture has been observed yet, so there is zero
      G5 evidence so far. Decision stays HOLD until evidence accumulates.
    decision_detail: >-
      HOLD on two independent gates, one structural and one operational.
      (1) SERVING, unchanged from Portfolio B: confirmed lineups publish 20-40
      minutes before kickoff, failing Gate G5 for this platform's
      browse-days-ahead surface. (2) ACQUISITION, newly measured 2026-09-10:
      the historical data DOES exist and IS accessible on the current plan
      (probe returned VERIFIED, 40 records for a season-2024 fixture), and the
      record content is sufficient - player_id, role="starting", and formation
      are exactly what expected-XI overlap, starter-absence counts and
      positional disruption need. But /fixtures/lineups takes only a `fixture`
      parameter with no league-season bulk form, so one season x 5 leagues
      costs 1,752 requests = 17.5 days of uninterrupted free-tier quota, and
      continuity metrics need the whole season rather than a sample. This is a
      costed operational gate, not a kill (§41) - the same class as E1's
      plan-tier wall, and resolvable by the same paid tier.
    information_source: "api_football /fixtures/lineups (collected today, unconsumed)"
    source_version: "api-sports.io v3, free plan (100 req/day)"
    source_license_class: L0
    source_coverage: >-
      Content sufficiency CONFIRMED on a live probe: 40 records for one
      fixture, carrying player_id, player_name, role, formation, team_id.
      Fixture-level coverage across a season NOT measured - measuring it is
      itself the 1,752-request acquisition this entry is blocked on.
    historical_window: >-
      Season 2024 confirmed reachable (the plan blocks only the current
      season, per E1's finding). Earlier seasons untested.
    prediction_cutoff: "T-20 to T-40 minutes - incompatible with days-ahead serving"
    dataset_version: null
    feature_version: null
    representation_version: "not built"
    model_version: null
    parameters: null
    seed: null
    training_window: null
    validation_windows: null
    final_holdout: null
    baseline_models: []
    market_baseline: null
    primary_metrics: [RPS]
    secondary_metrics: []
    bootstrap_method: null
    statistical_test: null
    multiple_testing_family: null
    effect_size: null
    confidence_interval: null
    sample_size: null
    result: >-
      No information-value test was run, and none can be until the corpus is
      acquired. What IS now established: the endpoint answers for historical
      fixtures on this plan, and its payload carries every field the §22
      representations require. orchestrator._collect_lineup_refresh() already
      exists as a dedicated late-firing evidence profile, so the architecture
      anticipated the timing problem, but nothing downstream consumes it.
    robustness: null
    failure_modes:
      - "Gate G5 structural failure for the primary serving surface (20-40 min pre-kickoff)"
      - "no bulk query shape: 1 request per fixture, 1,752 per season x 5 leagues"
      - "continuity metrics need consecutive fixtures per team, so sampling does not reduce the cost"
    compute: null
    peak_rss: null
    runtime: "1 live request spent on the feasibility probe"
    artifact_location: "reports/research/e2-lineup-availability-probe.json"
    scoped_harvest:
      status: "CONTRACT DEFINED, NOT YET HARVESTED"
      contract: "contracts/lineup_harvest_epl_contract.yaml"
      harvester: "backend/scripts/harvest_epl_e2_lineups.py (SUSPENDED)"
      prospective_monitor: "backend/scripts/shadow_monitor_e2_lineups.py"
      prospective_log: "backend/data/cache/lineup_g5_prospective_log.jsonl"
      scope: "EPL 2024/2025 only - 380 fixtures, ~4 days of free quota vs 17.5 for five leagues"
      g5_answerable_from_this_harvest: false
      g5_blocker: >-
        /fixtures/lineups publishes NO announcement timestamp (measured:
        e2-lineup-availability-probe.json sample_record_keys carries no temporal
        field), so lead_time_minutes is not derivable and every harvested row
        records servable_at_cutoff=UNKNOWN. The harvest yields lineup CONTENT
        for continuity features; it cannot answer prediction-time availability.
        Gate G5 for lineups is answerable only by a PROSPECTIVE probe that polls
        upcoming fixtures at the T-20m cutoff - designed in the contract, not built.
    provenance:
      - "docs/DEBT.md#65"
      - "docs/DEBT.md#80"
      - "reports/research/portfolio-b-player-availability-source-qualification.md §2b"
      - "reports/research/e2-lineup-availability-probe.json"
      - "contracts/lineup_harvest_epl_contract.yaml"
      - "backend/scripts/probe_lineup_availability.py"
    reviewer: UNDECLARED
    certification_status: "not a candidate"
    reopening_conditions: >-
      §42: (a) a paid api_football tier, which converts the 17.5-day quota wall
      into a bounded backfill and unblocks a retrospective Stage 1-3 test; or
      (b) a separately prioritised near-kickoff product surface, which would
      make the prediction cutoff compatible for serving. These are independent
      - (a) alone enables research, (b) alone enables serving, and promotion
      needs both. Do not build a training feature before (a).

