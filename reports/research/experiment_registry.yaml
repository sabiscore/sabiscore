  # =========================================================================
  - experiment_id: E0b
    title: "Vector scaling on the served head, all leagues, with paired CIs"
    portfolio: "A"
    hypothesis: >-
      Vector scaling improves proper scoring on the probabilities production
      actually serves, in every league, by a margin whose paired confidence
      interval excludes zero.
    migrated_retrospectively: false
    state: STATISTICAL_REVIEW
    decision: RESEARCH
    decision_detail: >-
      UNBLOCKED AND MEASURED, 2026-09-11, after the incumbent was retrained with
      season 2526 strictly held out (generation v11_clean2526, docs/DEBT.md item
      81). The contamination guard no longer fires for any league.
      Result: vector scaling on the served base-learner average improves RPS in
      exactly ONE of five leagues once the §18 family-wise correction is
      applied. SERIE_A: dRPS -0.00431, 95% CI [-0.00651, -0.00250], Bonferroni
      99% CI [-0.00706, -0.00187] - upper bound strictly negative at both
      levels, and Brier does not regress. The other four straddle zero at both
      levels (BUNDESLIGA +0.00173, EPL -0.00266, LA_LIGA -0.00201,
      LIGUE_1 -0.00373), so the direction is mostly favourable but not
      distinguishable from noise. The stated hypothesis was "in every league";
      that is answered NO.
      RESEARCH rather than PROMOTE because production readiness is incomplete
      and that is not a close call: the request path applies NO calibrator at
      all. The served artifacts carry no `calibrator` key, and the two
      functions that build the FittedCalibrator serving would apply
      (run_league_calibration, compare_calibration_methods) have zero callers
      repo-wide. Shipping a Serie-A calibrator therefore requires wiring that
      does not exist, not a config change.
      RESEARCH rather than HOLD because the measurement is no longer
      underpowered or blocked - it ran, on a clean split, with the interval §9
      requires.
      ⚠️ CORRECTED 2026-09-19 (DID Rule 11 — this document's own §51.1 gap):
      the "applies NO calibrator at all" premise above is now STALE, not
      current. docs/DEBT.md item 83 (RESOLVED 2026-09-15, four days after this
      entry) shipped a sigmoid/Platt FittedCalibrator into every v5_phase7
      artifact including serie_a_ensemble_v5_phase7.pkl, via a THIRD wiring
      path this entry did not name (`_fit_served_base_calibrator` in
      train_on_real_matches.py + the offline `inject_platt_calibrator.py`
      injector) — `run_league_calibration`/`compare_calibration_methods`
      genuinely remain zero-caller, but that is no longer the blocker, because
      production stopped routing through them. `baseline_models` above
      ("uncalibrated served base-learner average") is therefore not what
      SERIE_A currently serves. This does NOT mean vector scaling is now
      redundant or beaten: item 83's sigmoid fit and this entry's vector-
      scaling fit were measured on two different model generations with two
      different calibration/holdout season splits (item 83: v5_phase7,
      calibrate on 2324, holdout-evidence on 2425; this entry: v11_clean2526,
      calibrate on 2425, holdout-evidence on 2526) and are therefore NOT
      directly comparable — nobody has yet measured sigmoid vs. vector scaling
      head-to-head on the same generation and the same split. Decision stays
      RESEARCH; PROMOTE is not indicated by either study alone. Next step
      (not executed here — production model-serving code, Class C blast
      radius): re-fit both candidates on one held-out split of one generation
      and compare with the same paired-CI protocol before any wiring change.
      See docs/DEBT.md item 106.
    information_source: "none - no new external source"
    source_version: null
    source_license_class: null
    source_coverage: null
    historical_window: "corpus 1920-2526; train <=2324, calibration 2425, holdout 2526"
    prediction_cutoff: null
    dataset_version: "backend/data/processed/served_ensemble_predictions_holdout.parquet"
    feature_version: >-
      APEX_FEATURES_68 (apex_v1_68) — the evaluation baseline's contract.
      Serving remains on phase7_68/CANONICAL_FEATURES_68; flipping it is the
      separately-gated item 37/49 transition and was reverted (docs/DEBT.md#82).
    representation_version: "per-class scale+bias on centred log-odds, NLL + L2 (lambda=1e-3)"
    model_version: "v11_clean2526 (models/evaluation_baseline — NOT the serving manifest)"
    parameters: "L-BFGS-B, w in [1e-3, 10], b in [-5, 5]"
    seed: 42
    training_window: "season 2425 (calibration split; out-of-sample for the base learners)"
    validation_windows: "season 2526 (holdout; out-of-sample for the base learners)"
    final_holdout: >-
      none remaining - 2526 is the newest season in the corpus and is the
      evaluation holdout. A genuinely sealed final period requires 2627 data.
    baseline_models: ["uncalibrated served base-learner average"]
    market_baseline: "not applicable - calibration is not a market-edge claim (§5)"
    primary_metrics: [RPS, Brier, ECE]
    secondary_metrics: []
    bootstrap_method: "paired non-overlapping block bootstrap (Künsch 1989), 2000 replicates, block_size 10"
    statistical_test: >-
      Bonferroni family-wise CI (alpha 0.05 over 5 leagues -> 99% interval) for
      the mean paired loss difference must exclude zero; the nominal 95%
      interval is reported alongside it.
    multiple_testing_family: "5 leagues x 1 candidate"
    effect_size: >-
      SERIE_A dRPS -0.00431 on a base RPS of 0.2059 (~2.1% relative).
      Others: BUNDESLIGA +0.00173, EPL -0.00266, LA_LIGA -0.00201, LIGUE_1 -0.00373.
    confidence_interval: >-
      SERIE_A 95% [-0.00651, -0.00250], Bonferroni 99% [-0.00706, -0.00187].
      All four other leagues straddle zero at both levels.
    sample_size: "n_test 301-375 per league; n_cal 296-380"
    result: >-
      1 of 5 leagues (SERIE_A) shows a family-wise-significant RPS improvement
      with no Brier regression. The other four are indistinguishable from zero.
      The hypothesis as stated ("in every league") is answered NO.
    robustness: >-
      Survives Bonferroni correction over the declared 5-league family. NOT yet
      tested across multiple temporal folds - there is only one clean holdout
      season, so cross-period robustness (§18) is unmeasured.
    failure_modes:
      - "vector scaling does not generalise; four of five leagues show no distinguishable effect"
      - >-
        STALE as of 2026-09-19 (docs/DEBT.md item 106): "production readiness
        blocked independently: the request path applies no calibrator, and the
        FittedCalibrator builders have zero callers" was true 2026-09-11 but
        not after docs/DEBT.md item 83 (2026-09-15) shipped a sigmoid
        calibrator via a different, then-unbuilt wiring path. The named
        functions (run_league_calibration, compare_calibration_methods) are
        still zero-caller; that is simply no longer the reason SERIE_A vector
        scaling isn't served.
      - "single holdout season, so §18 cross-fold robustness cannot be evaluated"
      - >-
        NEW 2026-09-19: this study's own baseline ("uncalibrated served
        base-learner average") is not what production now serves for SERIE_A
        (item 83's sigmoid calibrator is), and the two were fit on different
        generations (v11_clean2526 vs v5_phase7) and different calibration/
        holdout splits, so this result cannot be read as "vector scaling beats
        what ships today" without a head-to-head re-measurement.
    compute: "numpy + polars + scipy; no GPU, well under the 8 GB ceiling"
    peak_rss: UNDECLARED
    runtime: UNDECLARED
    artifact_location: "reports/research/e0b_clean_baseline_results.json"
    superseded_artifacts:
      - >-
        reports/research/e0_multileague_vector_scaling_results.json - the
        pre-remediation run, retained because it is the record of the
        BLOCKED_CONTAMINATED_SPLIT state (docs/DEBT.md item 79)
    provenance:
      - "docs/DEBT.md#79"
      - "docs/DEBT.md#81"
      - "docs/DEBT.md#82"
      - "docs/DEBT.md#83"
      - "docs/DEBT.md#106"
      - "backend/scripts/evaluate_e0_vector_scaling_multileague.py"
      - "backend/tests/unit/test_e0_temporal_integrity_and_harvest.py"
    reviewer: UNDECLARED
    certification_status: "not a candidate"

